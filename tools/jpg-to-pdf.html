<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert one or more images into an A4 PDF."><title>JPG to PDF — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>JPG to PDF</h1><p>Convert one or more images into an A4 PDF.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="files" type="file" accept="image/*" multiple><strong>Drop your files here</strong><small>or click to choose from your device</small></div><div class="files" id="filesList">No files selected.</div><div class="controls"><button id="run" class="run" disabled>Process</button><button id="clear" class="secondary-btn">Clear</button></div><div class="result" id="result"></div></section></main><footer>PDF + Image Builder</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../tool.js"></script><script>async function imgData(f){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$("#run").onclick=async()=>{try{result.textContent="Creating PDF…";const doc=await PDFLib.PDFDocument.create();for(const f of state.files){const data=await imgData(f);const img=await doc.embedJpg(data);const page=doc.addPage([595.28,841.89]);const maxW=547,maxH=793,scale=Math.min(maxW/img.width,maxH/img.height);page.drawImage(img,{x:(595.28-img.width*scale)/2,y:(841.89-img.height*scale)/2,width:img.width*scale,height:img.height*scale})}await downloadPdf(doc,"images.pdf");result.textContent="Done — your PDF was downloaded."}catch(e){result.textContent="Error: "+e.message}}</script></body></html>
