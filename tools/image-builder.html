<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browser image builder"><title>Image Builder — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>Image Builder</h1><p>Edit an image in your browser and export it as PNG, JPG or WEBP.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="image" type="file" accept="image/*"><strong>Drop an image here</strong><small>or click to choose JPG, PNG or WEBP</small></div>
<div class="image-workspace"><aside class="panel"><label>Brightness</label><input id="brightness" type="range" min="0" max="200" value="100"><label>Contrast</label><input id="contrast" type="range" min="0" max="200" value="100"><label>Saturation</label><input id="saturation" type="range" min="0" max="200" value="100"><label>Rotation</label><select id="rotation"><option>0</option><option>90</option><option>180</option><option>270</option></select><label><input id="gray" type="checkbox"> Grayscale</label><label>Format</label><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select><div class="controls"><button class="run" id="download">Download</button></div></aside><div class="preview"><canvas id="canvas"></canvas></div></div><div class="result" id="result">Upload an image to begin.</div></section></main><footer>PDF + Image Builder</footer>
<script>
const $=s=>document.querySelector(s),drop=$("#drop"),input=$("#image"),canvas=$("#canvas"),ctx=canvas.getContext("2d");let img=null;
drop.onclick=()=>input.click();input.onchange=e=>load(e.target.files[0]);drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
function load(f){if(!f)return;img=new Image();img.onload=draw;img.src=URL.createObjectURL(f);$("#result").textContent="Loaded "+f.name}
["brightness","contrast","saturation","rotation","gray"].forEach(id=>$("#"+id).oninput=draw);
function draw(){if(!img)return;const r=Number($("#rotation").value),side=Math.abs(r)%180===90;const scale=Math.min(1,900/(side?img.height:img.width),520/(side?img.width:img.height));canvas.width=Math.round((side?img.height:img.width)*scale);canvas.height=Math.round((side?img.width:img.height)*scale);ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(r*Math.PI/180);ctx.filter=`brightness(${$("#brightness").value}%) contrast(${$("#contrast").value}%) saturate(${$("#saturation").value}%) ${$("#gray").checked?"grayscale(100%)":""}`;ctx.drawImage(img,-img.width*scale/2,-img.height*scale/2,img.width*scale,img.height*scale);ctx.restore()}
$("#download").onclick=()=>{if(!img){alert("Upload an image first.");return}canvas.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="edited-image."+$("#format").value.split("/")[1].replace("jpeg","jpg");a.click()},$("#format").value,.92)}
</script></body></html>
