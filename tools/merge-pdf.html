<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Combine multiple PDF files into one PDF."><title>Merge PDF — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>Merge PDF</h1><p>Combine multiple PDF files into one PDF.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="files" type="file" accept=".pdf" multiple><strong>Drop your files here</strong><small>or click to choose from your device</small></div><div class="files" id="filesList">No files selected.</div><div class="controls"><button id="run" class="run" disabled>Process</button><button id="clear" class="secondary-btn">Clear</button></div><div class="result" id="result"></div></section></main><footer>PDF + Image Builder</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../tool.js"></script><script>$("#run").onclick=async()=>{try{result.textContent="Merging…";const out=await PDFLib.PDFDocument.create();for(const f of state.files){const src=await pdfFromFile(f);const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}await downloadPdf(out,"merged.pdf");result.textContent="Done — your merged PDF was downloaded."}catch(e){result.textContent="Error: "+e.message}}</script></body></html>
