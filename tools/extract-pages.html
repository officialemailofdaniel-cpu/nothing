<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Extract selected pages into a new PDF."><title>Extract Pages — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>Extract Pages</h1><p>Extract selected pages into a new PDF.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="files" type="file" accept=".pdf" ><strong>Drop your file here</strong><small>or click to choose from your device</small></div><div class="files" id="filesList">No files selected.</div><div class="controls"><label style="width:100%;font-size:12px;font-weight:800">Pages (example: 1,3,5-7)<input id="pages" style="width:100%;margin-top:6px" placeholder="1,3,5-7"></label></div><div class="controls"><button id="run" class="run" disabled>Process</button><button id="clear" class="secondary-btn">Clear</button></div><div class="result" id="result"></div></section></main><footer>PDF + Image Builder</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../tool.js"></script><script>$("#run").onclick=async()=>{try{result.textContent="Processing…";const src=await pdfFromFile(state.files[0]);const idx=selectedPages($("#pages").value,src.getPageCount());if(!idx.length)throw Error("Enter at least one valid page.");const out=await PDFLib.PDFDocument.create();const pages=await out.copyPages(src,idx);pages.forEach(p=>out.addPage(p));await downloadPdf(out,"extracted.pdf");result.textContent="Done — your PDF was downloaded."}catch(e){result.textContent="Error: "+e.message}}</script></body></html>
