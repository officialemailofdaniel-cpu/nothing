<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Remove selected pages from a PDF."><title>Remove Pages — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>Remove Pages</h1><p>Remove selected pages from a PDF.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="files" type="file" accept=".pdf" ><strong>Drop your file here</strong><small>or click to choose from your device</small></div><div class="files" id="filesList">No files selected.</div><div class="controls"><label style="width:100%;font-size:12px;font-weight:800">Pages to remove (example: 2,4-6)<input id="pages" style="width:100%;margin-top:6px" placeholder="2,4-6"></label></div><div class="controls"><button id="run" class="run" disabled>Process</button><button id="clear" class="secondary-btn">Clear</button></div><div class="result" id="result"></div></section></main><footer>PDF + Image Builder</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../tool.js"></script><script>$("#run").onclick=async()=>{try{const doc=await pdfFromFile(state.files[0]);const remove=new Set(selectedPages($("#pages").value,doc.getPageCount()));if(remove.size>=doc.getPageCount())throw Error("At least one page must remain.");[...remove].sort((a,b)=>b-a).forEach(i=>doc.removePage(i));await downloadPdf(doc,"pages-removed.pdf");result.textContent="Done — your PDF was downloaded."}catch(e){result.textContent="Error: "+e.message}}</script></body></html>
