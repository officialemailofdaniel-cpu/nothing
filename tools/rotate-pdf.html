<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rotate all pages by 90°, 180° or 270°."><title>Rotate PDF — PDF + Image Builder</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="topbar"><a class="brand" href="../"><span>I</span><b>♥</b><strong>PDF+</strong></a><nav><a href="../#tools">PDF Tools</a><a href="../#image-tools">Image Tools</a></nav></header>
<main class="page"><a class="back" href="../">← All tools</a><div class="tool-title"><h1>Rotate PDF</h1><p>Rotate all pages by 90°, 180° or 270°.</p></div>
<section class="workspace"><div class="drop" id="drop"><input id="files" type="file" accept=".pdf" ><strong>Drop your file here</strong><small>or click to choose from your device</small></div><div class="files" id="filesList">No files selected.</div><div class="controls"><label style="font-size:12px;font-weight:800">Angle <select id="angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label></div><div class="controls"><button id="run" class="run" disabled>Process</button><button id="clear" class="secondary-btn">Clear</button></div><div class="result" id="result"></div></section></main><footer>PDF + Image Builder</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../tool.js"></script><script>$("#run").onclick=async()=>{try{result.textContent="Rotating…";const doc=await pdfFromFile(state.files[0]);const a=Number($("#angle").value);doc.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+a)%360)));await downloadPdf(doc,"rotated.pdf");result.textContent="Done — your rotated PDF was downloaded."}catch(e){result.textContent="Error: "+e.message}}</script></body></html>
